<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Arena</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050b1a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2358f0d0' stroke-width='2'/%3E%3Cpath d='M16 3v7M16 22v7M3 16h7M22 16h7' stroke='%23ff32a6' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud" aria-live="polite">
      <div class="hud-card">
        <span>生命值</span>
        <strong id="health">100</strong>
        <div class="health-bar" aria-label="玩家生命值">
          <div id="player-health-fill"></div>
        </div>
      </div>
      <div class="hud-card">
        <span>分數</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud-card">
        <span>敵人</span>
        <strong id="enemy-count">0</strong>
      </div>
      <div class="hud-card">
        <span>波次</span>
        <strong id="wave">1</strong>
      </div>
      <div class="hud-card weapon-status">
        <span>武器</span>
        <strong id="weapon-name">手槍</strong>
        <small id="ammo-count">彈匣 12 / 備用 36</small>
      </div>
    </div>

    <div id="crosshair" aria-hidden="true"></div>
    <canvas id="minimap" width="190" height="190" aria-label="小地圖"></canvas>

    <section id="start-screen" class="overlay">
      <div class="panel">
        <p class="eyebrow">NEON ARENA / PROTOTYPE</p>
        <h1>霓虹競技場</h1>
        <p>在敵人包圍你之前，移動、瞄準並消滅它們。</p>
        <button id="start-button" type="button">開始遊戲</button>
        <p class="controls">WASD 移動 ・ 左鍵射擊 ・ 右鍵換武器 ・ R 換彈</p>
        <p class="credit">
          地圖：
          <a href="https://sketchfab.com/3d-models/arena-standoff-2-96f730c204994ce185a681c2af1d2c40" target="_blank" rel="noopener">arena standoff 2</a>
          by frostychaos144 ・
          <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
        </p>
      </div>
    </section>

    <section id="game-over-screen" class="overlay hidden">
      <div class="panel">
        <p class="eyebrow">RUN COMPLETE</p>
        <h2>遊戲結束</h2>
        <p>最終分數：<strong id="final-score">0</strong></p>
        <button id="restart-button" type="button">重新開始</button>
      </div>
    </section>

    <section id="pause-screen" class="overlay hidden">
      <div class="panel">
        <p class="eyebrow">PAUSED</p>
        <h2>遊戲暫停</h2>
        <p>按下 Esc 或點擊按鈕繼續遊戲。</p>
        <button id="resume-button" type="button">繼續遊戲</button>
      </div>
    </section>

    <div id="notice" role="status">點擊「開始遊戲」鎖定滑鼠</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
